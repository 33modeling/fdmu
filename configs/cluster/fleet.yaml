# Node -> queue assignments for the H100 fleet.
#
# launch_node.sh with no argument reads this file and serves the queue
# assigned to the current hostname. Unassigned nodes and explicit queues that
# differ from the committed assignment are refused. fleet_status flags any
# claimed unit whose host is serving a queue it is not assigned to.
#
# Queue paths are relative to the repository root.
assignments:
  # run261224-ul2 released 2026-07-23: wave1 drained 160/160, workers killed.
  # Delete its stale snapshot with: rm runs/cluster_status/run261224-ul2.json
  run261216-unlearning: runs/cluster_queue/wave1_14b # 14B audit + alpha-dev
  # 2026-07-23 (freeze landed): ul3 serves the 7B audit + alpha wave.
  run261225-ul3: runs/cluster_queue/wave2            # 7B audit + alpha
  run261288-table: runs/cluster_queue/wave3          # RWKU-7B fidelity -> audit
  # Table 1/2 expansion queues (enqueue_table12.sh). Fill in the hostname of
  # each newly grabbed 8-GPU node before launch_node.sh will serve the queue.
  # NOTE: these queues are served from the branch WORKTREE
  # (/group-volume/jieuns.shin/retain-susceptibility-table12), so the paths
  # below are relative to that checkout, not the main clone.
  # 2026-07-24: test1 died mid-wave; run261630-table took over the WMDP W1
  # retry (adapter token-budget fix landed in the same commit). run261630-table
  # then bounced too; run261723-unlearning4 (8x H100, all free) takes the
  # WMDP fidelity+calibration wave (round-2 grid, commit 38e5130).
  run261723-unlearning4: runs/cluster_queue/wave_wmdp # WMDP-bio/MMLU W1 (+rwku fid)
  # <new-node-2>: runs/cluster_queue/wave_llama      # Llama-3.1-8B W1
  # <new-node-3>: runs/cluster_queue/wave_rwku       # RWKU audit (1 GPU enough)
  # WMDP on Qwen2.5-14B (enqueue_table12.sh wmdp-14b). Assign and commit the
  # grabbed 8-GPU node's hostname here. fp32 14B fits one H100 per worker
  # (probe_block), so one 8-GPU node runs the wave.
  # <new-node-4>: runs/cluster_queue/wave_wmdp14b    # WMDP-bio/MMLU on 14B
