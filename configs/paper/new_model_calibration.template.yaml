evidence:
  RQ1:
    require_lower_bounds_gt_zero: [joint_rho, joint_minus_S0, joint_minus_S1, tail_lift]
    tail_eligibility_coverage_min: 0.80
  RQ2:
    require_lower_bounds_gt_zero: [f_rho_minus_0p80, f_K_minus_0p70, g_H, g_ctl]
    require_valid_perturbations: true
    require_exact_reference: true
    require_common_control_support: true
  RQ3:
    damage_ucb_lt_zero:
      comparators: [no_repair, repeated_random, S0, S1]
      outcomes: [mean, CVaR95]
    native_noninferiority_lb_gt_zero_for_all_comparators: true
    require_all_five_arms_feasible_on_common_support: true
  CVaR95:
    empirical_tail_mass: 0.05
    fractional_boundary_weight: true
    n_lt_20_convention: maximum_and_low_tail_support_flag

freeze:
